name: Update Stats, Snake, and Contribution Grid SVG

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-stats-snake-grid:
    name: Generate and Push Stats, Snake, and Contribution Grid SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许写入 output 分支
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史记录

      - name: Debug WakaTime API
        run: |
          echo "Checking WakaTime API key"
          if [ -z "${{ secrets.WAKATIME_API_KEY }}" ]; then
            echo "Error: WAKATIME_API_KEY is not set"
            exit 1
          fi
          echo "Testing WakaTime API"
          curl -s -H "Authorization: Bearer ${{ secrets.WAKATIME_API_KEY }}" "https://wakatime.com/api/v1/users/current/stats/last_year" > wakatime_response.json
          if grep -q '"data"' wakatime_response.json; then
            echo "WakaTime API response contains data"
          else
            echo "Error: No data in WakaTime API response"
            cat wakatime_response.json
            exit 1
          fi

      - name: Generate WakaTime Activity Grid SVG
        run: |
          mkdir -p dist
          echo "Generating WakaTime activity grid SVG"
          WAKATIME_USERNAME="Benzyl_titanium"
          curl -s -o dist/wakatime-activity-grid.svg "https://wakatime.com/share/@${WAKATIME_USERNAME}/activity.last_year.svg"
          if [ -s dist/wakatime-activity-grid.svg ]; then
            echo "WakaTime activity grid SVG generated successfully"
          else
            echo "Error: WakaTime activity grid SVG is empty or not generated"
            exit 1
          fi
          
      - name: Generate Stats and Contribution Grid SVG
        run: |
          mkdir -p dist
          echo "Generating GitHub stats cards"
          curl -o dist/stats.svg "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&theme=radical&show_icons=true"
          curl -o dist/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=radical"
          echo "Generating contribution grid SVG"
          curl -o dist/github-contribution-grid.svg "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show=contributions&include_all_commits=true&count_private=true&theme=radical"

      - name: Generate Contribution Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
