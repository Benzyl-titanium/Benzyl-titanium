name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          user: ${{ github.repository_owner }}
          output_action: commit
          committer_branch: metrics
          committer_message: "chore: fix sort order with base prefixes"
          filename: github-metrics.svg

          template: classic
          config_display: large
          config_timezone: Asia/Shanghai

          config_order: base.header, base.activity, base.community, base.repositories, base.metadata, languages, rss, wakatime, isocalendar

          base: header, activity, community, repositories, metadata
          base_indepth: yes

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: lines, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          plugin_rss: yes
          plugin_rss_source: https://benzyl-titanium.pages.dev/rss.xml
          plugin_rss_limit: 5

          plugin_wakatime: yes
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_days: 7

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage
